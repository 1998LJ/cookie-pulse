name: Smoke RepoGate Action
on:
  workflow_dispatch:
    inputs:
      action_ref:
        description: 'RepoGate Action ref to smoke test'
        required: true
        default: 'v1.1.0'

jobs:
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Run RepoGate Action
        id: repogate
        uses: 1998LJ/t3n-repogate@v1.1.0
        with:
          github-token: ${{ github.token }}
          pr-url: https://github.com/1998LJ/t3n-repogate/pull/3
          fail-on-block: "false"

      - name: Verify Action Contract & Outputs
        run: |
          echo "=== RepoGate Output Verification ==="
          echo "target: '${{ steps.repogate.outputs.target }}'"
          echo "risk-score: '${{ steps.repogate.outputs.risk-score }}'"
          echo "merge-readiness: '${{ steps.repogate.outputs.merge-readiness }}'"
          echo "recommended-action: '${{ steps.repogate.outputs.recommended-action }}'"
          echo "report-path: '${{ steps.repogate.outputs.report-path }}'"
          echo "audit-exit-code: '${{ steps.repogate.outputs.audit-exit-code }}'"

          # 1. target != empty
          if [ -z "${{ steps.repogate.outputs.target }}" ]; then
            echo "FAILED: target is empty"
            exit 1
          fi

          # 2. risk-score != empty
          if [ -z "${{ steps.repogate.outputs.risk-score }}" ]; then
            echo "FAILED: risk-score is empty"
            exit 1
          fi

          # 3. merge-readiness != empty
          if [ -z "${{ steps.repogate.outputs.merge-readiness }}" ]; then
            echo "FAILED: merge-readiness is empty"
            exit 1
          fi

          # 4. recommended-action != empty
          if [ -z "${{ steps.repogate.outputs.recommended-action }}" ]; then
            echo "FAILED: recommended-action is empty"
            exit 1
          fi

          # 5. report-path != empty
          REPORT_PATH="${{ steps.repogate.outputs.report-path }}"
          if [ -z "$REPORT_PATH" ]; then
            echo "FAILED: report-path is empty"
            exit 1
          fi

          # 6. report file exists
          if [ ! -f "$REPORT_PATH" ]; then
            echo "FAILED: report file does not exist at $REPORT_PATH"
            exit 1
          fi
          echo "Report file verified at $REPORT_PATH"
          cat "$REPORT_PATH"

          # 7. audit-exit-code in {0, 1}
          AUDIT_CODE="${{ steps.repogate.outputs.audit-exit-code }}"
          if [ "$AUDIT_CODE" != "0" ] && [ "$AUDIT_CODE" != "1" ]; then
            echo "FAILED: audit-exit-code ($AUDIT_CODE) not in {0, 1}"
            exit 1
          fi

          echo "SUCCESS: All outputs and contracts verified successfully!"
